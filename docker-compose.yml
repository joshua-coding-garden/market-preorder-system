services:
  postgres:
    image: postgres:16-alpine
    container_name: market-preorder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_preorder
      TZ: Asia/Taipei
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market_preorder']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
